    <link rel="icon" type="image/x-icon" href="./assets/logo.png" />

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Tailwind untuk mengaktifkan Dark Mode via class -->
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <!-- Font Awesome 6 (free) -->
    <link
      rel="stylesheet"

    />

    <!-- Custom style -->
    <style>
      /* === RESET & DASAR === */
      * {
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      /* === CARD HOVER === */
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
      }
      .dark .card-hover:hover {
        box-shadow: 0 12px 24px -8px rgba(255, 255, 255, 0.08);
      }

      /* === STATUS PULSE === */
      .status-pulse {
        animation: pulse-dot 1.8s infinite;
      }
      @keyframes pulse-dot {
        0% {
          opacity: 0.6;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
        100% {
          opacity: 0.6;
          transform: scale(0.95);
        }
      }

      /* === KONTAINER === */
      .container-custom {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
      @media (min-width: 640px) {
        .container-custom {
          max-width: 640px;
        }
      }
      @media (min-width: 768px) {
        .container-custom {
          max-width: 720px;
        }
      }
      @media (min-width: 1024px) {
        .container-custom {
          max-width: 800px;
        }
      }

      /* === DARK MODE TOGGLE === */
      .dark-toggle {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        padding: 0.5rem 0.9rem;
      }
      .dark .dark-toggle {
        background: rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
